name: Release

# A tag creates a draft release. Manual runs and pull requests that touch the
# packaging only build, and keep the packages as workflow artifacts.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
  pull_request:
    paths:
      - .github/workflows/release.yml
      - packaging/**

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    outputs:
      deb_version: ${{ steps.version.outputs.deb_version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Version
        id: version
        run: |
          version="$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)"
          if [ "$GITHUB_REF_TYPE" = tag ] && [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "tag $GITHUB_REF_NAME does not match Cargo.toml version $version" >&2
            exit 1
          fi
          echo "deb_version=$(packaging/debian/deb-version.sh "$version")" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .devtools/dict-cache
          key: dict-sources-${{ hashFiles('tools/build-dicts.py') }}
      - name: Dictionaries
        run: |
          python3 tools/build-dicts.py
          git diff --exit-code data/dict/SOURCES.md
      - name: Container image
        run: podman build -t glissando-cross:forky -f packaging/cross/Containerfile packaging/cross
      - name: Binaries
        run: packaging/cross/build-arm64.sh
      - name: Speech engine and model
        run: |
          packaging/voice/build-whisper.sh
          packaging/voice/fetch-model.sh
      - name: Packages
        run: packaging/debian/build-deb.sh
      - name: Dictionary archive and checksums
        env:
          DEB_VERSION: ${{ steps.version.outputs.deb_version }}
        run: |
          tar -C data/dict -cJf "dist/glissando-dicts_${DEB_VERSION}.tar.xz" \
            --sort=name --mtime=@0 --owner=0 --group=0 --numeric-owner \
            en.gld de.gld ru.gld SOURCES.md
          cd dist
          # GitHub rewrites "~" in asset names, which would break SHA256SUMS.
          for f in *~*; do
            [ -e "$f" ] && mv -- "$f" "${f//\~/-}"
          done
          sha256sum -- *.deb *.tar.xz > SHA256SUMS
          cat SHA256SUMS
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: packages
          path: dist/
          if-no-files-found: error
          retention-days: 7

  release:
    if: github.event_name == 'push'
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: packages
          path: dist
      - name: Draft release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          flags=()
          case "$TAG" in *-*) flags+=(--prerelease) ;; esac
          gh release create "$TAG" dist/* --draft --verify-tag --generate-notes "${flags[@]}"
