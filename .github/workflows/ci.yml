name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libglib2.0-dev libcairo2-dev libpango1.0-dev libgtk-4-dev libadwaita-1-dev
      - name: Toolchain
        run: rustup toolchain install stable --profile minimal -c rustfmt -c clippy && rustup default stable
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-${{ hashFiles('Cargo.lock') }}
      - name: Formatting
        run: cargo fmt --all --check
      - name: Lints
        run: cargo clippy --locked --workspace --all-targets -- -D warnings
      - name: Build
        run: cargo build --locked --workspace
      - name: Unit tests
        run: cargo test --locked --workspace
      - name: No networking crates
        run: |
          ! cargo metadata --format-version 1 --locked | python3 -c 'import json,sys; print("\n".join(p["name"] for p in json.load(sys.stdin)["packages"]))' \
            | grep -qxE 'reqwest|hyper|ureq|curl|openssl|native-tls|rustls|h2|quinn|sentry'

  dictionaries:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .devtools/dict-cache
          key: dict-sources-${{ hashFiles('tools/build-dicts.py') }}
      - name: Build from the pinned sources
        run: python3 tools/build-dicts.py
      - name: Output matches the committed hashes
        run: git diff --exit-code data/dict/SOURCES.md
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dictionaries
          path: data/dict/*.gld
          if-no-files-found: error
          retention-days: 7
